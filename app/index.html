<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Demandas</title>
  <meta name="theme-color" content="#6d0101">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Demandas">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ============ LOGIN ============ -->
  <section id="tela-login" class="tela" hidden>
    <div class="login-caixa">
      <img src="icons/icon-192.png" alt="" class="login-logo">
      <h1>Demandas</h1>
      <p class="sub">Tudo o que precisa ser feito, em um só lugar.</p>
      <form id="form-login">
        <label>E-mail<input type="email" name="email" autocomplete="username" required></label>
        <label>Senha<input type="password" name="senha" autocomplete="current-password" required></label>
        <button class="btn primario grande" type="submit">Entrar</button>
        <p class="erro" id="erro-login" hidden></p>
      </form>
    </div>
  </section>

  <!-- ============ PRINCIPAL ============ -->
  <section id="tela-principal" class="tela" hidden>
    <header class="topo">
      <div class="topo-linha">
        <h1>Demandas</h1>
        <button class="icone-btn" id="btn-ajustes" aria-label="Ajustes">
          <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Zm7.43-2.53a7.8 7.8 0 0 0 0-1.94l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.6-.22l-2.49 1a7.3 7.3 0 0 0-1.68-.98l-.38-2.65A.5.5 0 0 0 14 2h-4a.5.5 0 0 0-.5.42l-.38 2.65c-.6.25-1.17.57-1.68.98l-2.49-1a.5.5 0 0 0-.6.22l-2 3.46a.5.5 0 0 0 .12.64l2.11 1.65a7.8 7.8 0 0 0 0 1.94l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46c.13.22.39.31.6.22l2.49-1c.51.41 1.08.73 1.68.98l.38 2.65c.05.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.38-2.65c.6-.25 1.17-.57 1.68-.98l2.49 1c.22.09.47 0 .6-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.65Z"/></svg>
        </button>
      </div>
      <div class="busca">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.5 6.5 0 1 0 14 15.5l.27.28v.79l5 5L20.49 20l-5-5Zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9Z"/></svg>
        <input type="search" id="busca" placeholder="Buscar demanda" autocomplete="off">
      </div>
      <nav class="abas" role="tablist">
        <button role="tab" data-aba="a_fazer" class="ativa">A fazer <span class="cont" id="cont-a_fazer">0</span></button>
        <button role="tab" data-aba="andamento">Em andamento <span class="cont" id="cont-andamento">0</span></button>
        <button role="tab" data-aba="feito">Feito <span class="cont" id="cont-feito">0</span></button>
      </nav>
    </header>

    <div id="aviso-instalar" class="aviso" hidden></div>

    <main id="lista" class="lista" aria-live="polite"></main>

    <button class="fab" id="btn-nova" aria-label="Nova demanda">
      <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2Z"/></svg>
    </button>
  </section>

  <!-- ============ FOLHA: NOVA DEMANDA ============ -->
  <div class="fundo" id="folha-nova" hidden>
    <div class="folha" role="dialog" aria-labelledby="t-nova">
      <div class="folha-topo">
        <button class="link" data-fechar>Cancelar</button>
        <h2 id="t-nova">Nova demanda</h2>
        <span></span>
      </div>
      <form id="form-nova" class="folha-corpo">
        <label>O que precisa ser feito?<input name="titulo" required maxlength="200" placeholder="Ex.: Protocolar recurso do João"></label>
        <label>Detalhes<textarea name="descricao" rows="4" placeholder="Informações, links, observações…"></textarea></label>
        <fieldset class="prioridades">
          <legend>Prioridade</legend>
          <label class="pri p1"><input type="radio" name="prioridade" value="1"><span>Alta</span></label>
          <label class="pri p2"><input type="radio" name="prioridade" value="2" checked><span>Média</span></label>
          <label class="pri p3"><input type="radio" name="prioridade" value="3"><span>Baixa</span></label>
        </fieldset>
        <label class="arquivo-btn">
          <input type="file" name="arquivos" multiple accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx,.txt">
          <span>📎 Anexar fotos ou arquivos</span>
        </label>
        <ul class="arquivos-escolhidos" id="arquivos-escolhidos"></ul>
        <button class="btn primario grande" type="submit">Criar demanda</button>
      </form>
    </div>
  </div>

  <!-- ============ FOLHA: DETALHE ============ -->
  <div class="fundo" id="folha-detalhe" hidden>
    <div class="folha alta" role="dialog" aria-labelledby="d-titulo">
      <div class="folha-topo">
        <button class="link" data-fechar>Fechar</button>
        <h2>Demanda</h2>
        <button class="link perigo" id="btn-excluir">Excluir</button>
      </div>
      <div class="folha-corpo" id="detalhe"></div>
    </div>
  </div>

  <!-- ============ FOLHA: AJUSTES ============ -->
  <div class="fundo" id="folha-ajustes" hidden>
    <div class="folha" role="dialog" aria-labelledby="t-ajustes">
      <div class="folha-topo">
        <span></span>
        <h2 id="t-ajustes">Ajustes</h2>
        <button class="link" data-fechar>OK</button>
      </div>
      <div class="folha-corpo">
        <form id="form-nome" class="linha-form">
          <label>Seu nome<input name="nome" maxlength="60" required></label>
          <button class="btn" type="submit">Salvar</button>
        </form>
        <div class="bloco">
          <h3>Notificações</h3>
          <p class="sub" id="status-notif">—</p>
          <button class="btn primario" id="btn-notif">Ativar notificações neste celular</button>
        </div>
        <div class="bloco" id="bloco-instalar" hidden>
          <h3>Instalar app</h3>
          <button class="btn" id="btn-instalar">Instalar na tela inicial</button>
        </div>
        <div class="bloco">
          <p class="sub" id="usuario-email"></p>
          <button class="btn perigo" id="btn-sair">Sair</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
